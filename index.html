:root[data-theme="dark"]{--bg:#121715;--pn:#1b2220;--ink:#e8efe9;--mut:#9aa8a0;--ln:#2e3935;--ac:#fb7185;--acx:#2a0610;--soft:#3a1620;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24;--wsoft:#3a2f10;--bsoft:#3b1717;--gsoft:#12301d}

<script>
/* ===== helpers ===== */
const $=s=>document.querySelector(s);
const fx=(x,d=2)=>Number.isFinite(x)?x.toFixed(d):"–";
function RNG(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const SEED0=(Date.now()&0xffffff)>>>0;
const rng=k=>{let h=SEED0;for(const c of String(k))h=Math.imul(h^c.charCodeAt(0),16777619);return RNG(h)};
const rr=(r,a,b)=>a+(b-a)*r();
const EXPS=[],NEED=12;
const UNITS=[{n:1,t:"Qualitative biochemistry",sub:"Experiments 1–3"},{n:2,t:"Quantitative estimations in blood, serum and tissue",sub:"Experiments 4–7, 11–14"},{n:3,t:"Enzymology (salivary amylase)",sub:"Experiments 8–10"}];
const REFS=["Plummer, D. T. An Introduction to Practical Biochemistry. McGraw-Hill, New York.","Wilson, K., and Walker, J. Principles and Techniques of Biochemistry and Molecular Biology. Cambridge University Press.","Varley, H., Gowenlock, A. H., Bell, M., and Bell, J. L. Varley's Practical Clinical Biochemistry. Heinemann Medical Books.","Burtis, C. A., Ashwood, E. R., and Bruns, D. E. Tietz Textbook of Clinical Chemistry and Molecular Diagnostics. Elsevier.","Rodwell, V. W., Bender, D. A., Botham, K. M., Kennelly, P. J., and Weil, P. A. Harper's Illustrated Biochemistry. McGraw-Hill.","Freifelder, D. Essential Molecular Biology: A Practical Approach. Oxford University Press."];
const VQ=(q,o,a,e)=>({q,o,a,e});
/* ===== state ===== */
const S={sel:null,tab:"home",done:{},rec:[],st:{},vv:{},sub:{},name:"",roll:"",dl:null};
const PSEUDO={};
const EX=id=>EXPS.find(e=>e.id===id)||PSEUDO[id];
const ST=(e,f)=>S.st[e.id]||(S.st[e.id]=f(e));
function addRec(id,line){const e=EX(id);S.rec=S.rec.filter(r=>!(r.id===id&&r.k===line.k));S.rec.push(Object.assign({id,title:e.t,u:e.u},line));S.done[id.split("_")[0]]=1}
const msgH=m=>m?`<div class="${m.c||"note"}">${m.t}</div>`:"";
/* form helpers: values live in st.in and survive re-render */
const inV=(st,k,d="")=>st.in&&st.in[k]!=null?st.in[k]:d;
const inp=(id,st,k,ph,w)=>`<input type="number" step="any" style="width:${w||110}px" placeholder="${ph||""}" value="${inV(st,k)}" data-k="${k}" data-id="${id}">`;
const sel=(id,st,k,opts,def)=>{const v=inV(st,k,def);return`<select data-k="${k}" data-id="${id}">${opts.map(o=>{const [val,lab]=Array.isArray(o)?o:[o,o];return`<option value="${val}" ${String(val)===String(v)?"selected":""}>${lab}</option>`}).join("")}</select>`};
const btn=(a,id,txt,cls,v,dis)=>`<button class="${cls||"g"}" data-a="${a}" data-id="${id}" ${v!=null?`data-v="${v}"`:""} ${dis?"disabled":""}>${txt}</button>`;
const num=(st,k)=>parseFloat(inV(st,k));
const pick=(r,a)=>a[Math.floor(r()*a.length)];
function tubeSVG(col,ppt,lab,w){const f=col||"#e8f1f5";return`<svg viewBox="0 0 70 150" width="${w||64}" style="flex:none"><path d="M12 8 H58 V112 Q58 140 35 140 Q12 140 12 112 Z" fill="none" stroke="#8a97a0" stroke-width="2.5"/><path d="M14 46 H56 V112 Q56 138 35 138 Q14 138 14 112 Z" fill="${f}" opacity=".92"/>${ppt?`<path d="M20 118 Q35 108 50 118 Q48 136 35 136 Q22 136 20 118Z" fill="${ppt}"/>`:""}<text x="35" y="26" text-anchor="middle" font-size="10" fill="currentColor">${lab||""}</text></svg>`}
/* ===== QUALITATIVE TEST ENGINE ===== */
function tstInit(e,n){const r=Math.random;const prev=(S.st[e.id]||{}).i;let i=Math.floor((n?r():rng(e.id)())*e.sim.samples.length);if(n&&i===prev)i=(i+1)%e.sim.samples.length;return{i,n:n||0,done:{},order:[],last:null,ans:null,in:{}}}
function tstRes(e,st,t){const s=e.sim.samples[st.i];return(s.over&&s.over[t.id])||(s.pos.includes(t.fl)?t.pos:t.neg)}
function tstHTML(e){const L=e.sim,st=ST(e,x=>tstInit(x,0)),s=L.samples[st.i],lt=String.fromCharCode(65+st.n%26);
 let h=`<div class="note"><b>Unknown sample ${lt}</b> is on your bench. ${L.intro}</div><div class="grid2"><div><h3>Choose a test</h3>`;
 h+=L.tests.map(t=>`<div style="margin:3px 0">${btn("tst_do",e.id,(st.done[t.id]?"✔ ":"")+t.n,st.last===t.id?"b":"g",t.id)}</div>`).join("")+`</div><div>`;
 if(st.last){const t=L.tests.find(x=>x.id===st.last),r=tstRes(e,st,t);h+=`<h3>${t.n}</h3><div class="small mut">${t.p}</div><div class="row" style="align-items:center">${tubeSVG(r[1],r[2],"")}<div><b>Observation:</b> ${r[0]}</div></div>`}
 else h+=`<p class="mut">Select a test to run it on the unknown. Each result is written into your notebook below.</p>`;
 h+=`</div></div>`;
 if(st.order.length)h+=`<h3>Notebook (${st.order.length} tests)</h3><div style="overflow-x:auto"><table><tr><th>Test</th><th>Observation</th></tr>${st.order.map(id=>{const t=L.tests.find(x=>x.id===id);return`<tr><td>${t.n}</td><td>${tstRes(e,st,t)[0]}</td></tr>`}).join("")}</table></div>`;
 h+=`<h3>Identify the unknown</h3><div class="row">${L.opts.map((o,i)=>btn("tst_id",e.id,o,st.ans===i?(i===s.a?"b":"g"):"g",i,st.ans!=null)).join("")}</div>`;
 if(st.ans!=null){const ok=st.ans===s.a;h+=`<div class="${ok?"okb":"badb"}"><b>${ok?"Correct.":"Not correct."}</b> Sample ${lt} was <b>${L.opts[s.a]}</b>. ${s.why} You used ${st.order.length} test(s).</div>${btn("tst_new",e.id,"Try another unknown","g")}`}
 return h}
function tstAct(a,d){const e=EX(d.id),st=ST(e,x=>tstInit(x,0)),s=e.sim.samples[st.i];
 if(a==="tst_do"){if(!st.done[d.v]){st.done[d.v]=1;st.order.push(d.v)}st.last=d.v}
 else if(a==="tst_id"&&st.ans==null){st.ans=+d.v;const ok=st.ans===s.a;addRec(e.id,{k:"u"+st.n,sample:"Unknown "+String.fromCharCode(65+st.n%26),res:"Identified as "+e.sim.opts[st.ans]+" (actual: "+e.sim.opts[s.a]+"); "+st.order.length+" tests used",ok})}
 else if(a==="tst_new"){S.st[e.id]=tstInit(e,st.n+1)}}
const TP=(id,n,p,fl,pos,neg)=>({id,n,p,fl,pos,neg});
/* ---- B1 proteins ---- */
EXPS.push({id:"B1",u:1,t:"Identification tests for proteins (albumin and casein)",
aim:"To identify an unknown protein as albumin or casein using classical colour, precipitation and coagulation tests, and to relate each reaction to the amino-acid or structural feature responsible.",
req:"Test tubes, water bath, Bunsen burner, droppers; 1% egg-albumin solution; 1% casein solution (in dilute alkali); Biuret, Millon's, Hopkins–Cole, ninhydrin, lead acetate, conc. HNO₃, 10% and 40% NaOH, saturated ammonium sulphate, 2% acetic acid.",
th:`<h3>Principle</h3><p>Proteins are polymers of L-α-amino acids joined by peptide bonds. <b>Colour reactions</b> detect the peptide bond (Biuret) or particular side chains: tyrosine (Millon's, xanthoproteic), tryptophan (Hopkins–Cole), cysteine/cystine sulphur (lead acetate), free α-amino groups (ninhydrin). These tests show that a sample is a protein but seldom separate one protein from another.</p><h3>What separates albumin from casein</h3><ul><li><b>Albumin</b> (ovalbumin, a simple globular protein, pI ≈ 4.7) is coagulated irreversibly by heat, is salted out only by full saturation with ammonium sulphate and contains cysteine, so it gives a black PbS precipitate.</li><li><b>Casein</b> (a phosphoprotein of milk, pI ≈ 4.6) is not coagulated by heat, precipitates at its isoelectric point on adding acetic acid, is salted out at half saturation and has almost no cysteine, so the lead acetate test is negative.</li></ul><h3>Reactions</h3><p>Biuret: Cu²⁺ + ≥2 peptide bonds in alkali → violet complex. Millon's: Hg²⁺/HNO₃ nitrates and complexes the phenol ring of tyrosine → red. Lead acetate: S²⁻ released by alkali + Pb²⁺ → PbS.</p>`,
steps:["Take 2 mL of the unknown in a tube for each test; work on separate portions.","Apply general protein tests first (Biuret, ninhydrin, Millon's) to confirm it is a protein.","Apply the discriminating tests: heat coagulation, acetic acid at pH 4.6, half-saturation with (NH₄)₂SO₄ and the lead acetate sulphur test.","Record every observation in the notebook, compare with the known behaviour of albumin and casein, and report the identity with the tests that decided it."],
viva:[VQ("Which test detects the peptide bond?",["Millon's test","Biuret test","Ninhydrin test","Hopkins–Cole test"],1,"Biuret reagent (alkaline Cu²⁺) forms a violet complex with two or more peptide bonds."),VQ("Why does casein precipitate when acetic acid is added to pH 4.6?",["It is denatured by acid","It reaches its isoelectric point and has zero net charge","It loses its sulphur","It forms a Cu complex"],1,"At the pI the net charge is zero, repulsion falls and the protein aggregates."),VQ("A protein that gives a black precipitate with alkaline lead acetate must contain:",["Tyrosine","Tryptophan","Cysteine or cystine","Proline"],2,"Alkali liberates sulphide from cysteine/cystine, which gives PbS."),VQ("Millon's test is negative for a protein lacking:",["Tyrosine","Glycine","Lysine","Serine"],0,"Millon's reaction needs the phenolic ring of tyrosine.")],
sim:{kind:"tests",intro:"Albumin and casein are the two candidates. Decide which tests can tell them apart.",opts:["Albumin","Casein"],
tests:[TP("biuret","Biuret test","2 mL sample + 2 mL 10% NaOH + 2–3 drops of 1% CuSO₄; mix.","pep",["Violet colour: peptide bonds present.","#8b5cf6"],["Remains pale blue.","#7dd3fc"]),
TP("millon","Millon's test","2 mL sample + 1 mL Millon's reagent; warm gently.","tyr",["White ppt turns brick-red on warming: tyrosine present.","#fecaca","#b91c1c"],["Only a white precipitate; no red colour.","#e5e7eb"]),
TP("xanth","Xanthoproteic test","2 mL sample + 1 mL conc. HNO₃; boil, cool, then add NaOH dropwise.","aro",["Yellow on boiling, deep orange with NaOH: aromatic amino acids present.","#f59e0b"],["No yellow colour.","#e5e7eb"]),
TP("ninh","Ninhydrin test","2 mL sample + 0.5 mL 0.2% ninhydrin; boil 1–2 min.","aa",["Blue-violet colour (Ruhemann's purple): free α-amino groups.","#4338ca"],["No colour.","#e5e7eb"]),
TP("hopk","Hopkins–Cole test","2 mL sample + 2 mL glyoxylic acid reagent; layer conc. H₂SO₄ carefully down the side.","trp",["Violet ring at the junction: tryptophan present.","#7c3aed"],["No violet ring.","#e5e7eb"]),
TP("lead","Lead acetate (sulphur) test","2 mL sample + 2 mL 40% NaOH; boil 2 min; add 1 mL lead acetate; boil again.","cys",["Black ppt of PbS: sulphur-containing amino acids present.","#9ca3af","#111827"],["No black precipitate; solution stays clear.","#e5e7eb"]),
TP("heat","Heat coagulation","3 mL sample in a boiling water bath for 5 min.","heat",["White coagulum forms: heat-denatured protein.","#f5f5f4","#fafaf9"],["Stays clear or opalescent; no coagulum.","#eef2f7"]),
TP("acid","Acetic acid at pH 4.6","2 mL sample + 2% acetic acid dropwise to pH ≈ 4.6.","pi",["White precipitate at the isoelectric point; it redissolves in excess acid.","#f5f5f4","#fafaf9"],["Stays clear; no precipitate.","#eef2f7"]),
TP("half","Half-saturation with (NH₄)₂SO₄","2 mL sample + 2 mL saturated ammonium sulphate solution.","half",["White precipitate: salted out at half saturation.","#f5f5f4","#fafaf9"],["Remains clear: not salted out at half saturation.","#eef2f7"]),
TP("full","Full saturation with (NH₄)₂SO₄","Filter the half-saturated tube; add solid (NH₄)₂SO₄ to the filtrate until no more dissolves.","full",["White precipitate: all proteins salted out at full saturation.","#f5f5f4","#fafaf9"],["No precipitate.","#eef2f7"])],
samples:[{k:"alb",a:0,pos:["pep","tyr","aro","aa","trp","cys","heat","full"],why:"It coagulated on heating, gave the black lead sulphide test and was not salted out at half saturation or by acetic acid."},{k:"cas",a:1,pos:["pep","tyr","aro","aa","trp","pi","half","full"],why:"It did not coagulate on heating, gave no PbS but precipitated at pH 4.6 and at half saturation."}]}});
/* ---- B2 carbohydrates ---- */
const CT=(id,n,p,fl,pos,neg,over)=>Object.assign(TP(id,n,p,fl,pos,neg),{});
EXPS.push({id:"B2",u:1,t:"Qualitative analysis of carbohydrates (glucose, fructose, lactose, sucrose, starch)",
aim:"To identify glucose, fructose, lactose, sucrose and starch from a systematic scheme of group tests (Molisch, iodine), reducing tests (Benedict's, Fehling's), Barfoed's and Seliwanoff's tests, and osazone and mucic acid tests.",
req:"Test tubes, water bath, Molisch reagent, iodine solution, Benedict's and Fehling's solutions, Barfoed's reagent, Seliwanoff's reagent, conc. H₂SO₄ and HNO₃, phenylhydrazine hydrochloride + sodium acetate, 1% solutions of the five carbohydrates.",
th:`<h3>Principle</h3><p>Carbohydrates are polyhydroxy aldehydes or ketones or their polymers. <b>Molisch</b>: conc. H₂SO₄ dehydrates any carbohydrate to furfural or hydroxymethylfurfural, which condenses with α-naphthol to a purple ring. <b>Iodine</b>: starch (amylose helix) traps I₃⁻ to give blue-black. <b>Benedict's/Fehling's</b>: a free aldehyde, or an α-hydroxy ketone that isomerises in alkali, reduces blue Cu²⁺ to red Cu₂O. <b>Barfoed's</b> (acidic Cu acetate) is reduced by monosaccharides within 2 minutes but only slowly by reducing disaccharides. <b>Seliwanoff's</b> gives cherry-red with ketoses (fructose, and sucrose after hydrolysis) in 1 minute because ketoses form hydroxymethylfurfural fastest. <b>Mucic acid</b>: galactose (from lactose) is oxidised by HNO₃ to insoluble mucic acid.</p><table><tr><th></th><th>Molisch</th><th>Iodine</th><th>Benedict's</th><th>Barfoed's</th><th>Seliwanoff's</th><th>Mucic acid</th></tr><tr><td>Glucose</td><td>+</td><td>–</td><td>+</td><td>+</td><td>–</td><td>–</td></tr><tr><td>Fructose</td><td>+</td><td>–</td><td>+</td><td>+</td><td>+</td><td>–</td></tr><tr><td>Lactose</td><td>+</td><td>–</td><td>+</td><td>–</td><td>–</td><td>+</td></tr><tr><td>Sucrose</td><td>+</td><td>–</td><td>–</td><td>–</td><td>+ (slower)</td><td>–</td></tr><tr><td>Starch</td><td>+</td><td>blue-black</td><td>–</td><td>–</td><td>–</td><td>–</td></tr></table>`,
steps:["Apply Molisch's test to confirm that the unknown is a carbohydrate.","Apply the iodine test; a blue-black colour means starch and you can stop.","Apply Benedict's test: no red precipitate points to sucrose, so confirm by Benedict's test after acid hydrolysis.","If reducing, use Barfoed's test to separate monosaccharides from lactose, then Seliwanoff's test to separate fructose from glucose; confirm lactose by the mucic acid test.","Record all observations and state the identity."],
viva:[VQ("Which sugar is non-reducing but becomes reducing after boiling with dilute acid?",["Glucose","Lactose","Sucrose","Fructose"],2,"Sucrose has both anomeric carbons in the glycosidic bond; hydrolysis releases glucose and fructose."),VQ("Seliwanoff's reagent specifically detects:",["Aldoses","Ketoses","Pentoses only","Starch"],1,"Ketoses dehydrate faster to hydroxymethylfurfural, which gives cherry-red with resorcinol."),VQ("Why does Barfoed's test separate monosaccharides from disaccharides?",["The reagent is alkaline","Monosaccharides reduce the weakly acidic Cu²⁺ faster","Disaccharides are not carbohydrates","It uses iodine"],1,"In weakly acidic Cu acetate only the more strongly reducing monosaccharides react within 2 minutes."),VQ("Which carbohydrate gives mucic acid with nitric acid?",["Glucose","Lactose","Sucrose","Starch"],1,"Lactose contains galactose, which is oxidised to the insoluble mucic acid.")],
sim:{kind:"tests",intro:"The unknown is one of glucose, fructose, lactose, sucrose or starch. Work out a short sequence of tests that identifies it.",opts:["Glucose","Fructose","Lactose","Sucrose","Starch"],

req:"Colorimeter (505 nm), micropipettes, water bath at 37 °C, GOD-POD working reagent, glucose standard 100 mg/dL, fluoride-oxalate plasma or serum.",
th:`<h3>Principle</h3><p>Glucose oxidase (GOD) oxidises β-D-glucose to gluconic acid and hydrogen peroxide. In the presence of peroxidase (POD), H₂O₂ oxidatively couples 4-aminoantipyrine with phenol to give a pink quinoneimine dye, absorbing at 505 nm. The colour intensity is proportional to the glucose concentration (Beer–Lambert law).</p><p>Glucose + O₂ + H₂O → gluconic acid + H₂O₂ (GOD)<br>2 H₂O₂ + 4-aminoantipyrine + phenol → quinoneimine + 4 H₂O (POD)</p><h3>Calculation</h3><p>Glucose (mg/dL) = (A<sub>T</sub> / A<sub>S</sub>) × 100</p><h3>Clinical interpretation (ADA)</h3><p>Fasting: 70–99 mg/dL normal; 100–125 impaired fasting glucose; ≥ 126 diabetes mellitus (confirmed on a second occasion). 2-h post-prandial: below 140 normal; 140–199 impaired tolerance; ≥ 200 diabetes. Below 70 mg/dL is hypoglycaemia. Glycolysis in the tube lowers glucose by 5–7% per hour, so fluoride is used or the serum is separated quickly.</p>`,
steps:["Label three tubes Blank, Standard and Test.","Add 1000 µL working reagent to each tube.","Add 10 µL standard to S and 10 µL sample to T.","Mix and incubate 10 min at 37 °C.","Read absorbance at 505 nm against the reagent blank.","Calculate and interpret."],
viva:[VQ("Why is the GOD-POD method more specific than Benedict's test or o-toluidine?",["It uses heat","Glucose oxidase acts only on β-D-glucose","It uses a colorimeter","It needs no reagent"],1,"The enzyme is specific for glucose; chemical methods also react with other reducing sugars."),VQ("Which is the colour-forming step?",["Glucose → gluconic acid","Peroxidase-catalysed coupling of 4-aminoantipyrine and phenol with H₂O₂","Protein precipitation","Centrifugation"],1,"Quinoneimine is the pink chromogen."),VQ("A fasting glucose of 112 mg/dL is classified as:",["Normal","Impaired fasting glucose","Diabetes mellitus","Hypoglycaemia"],1,"100–125 mg/dL is impaired fasting glucose (prediabetes)."),VQ("Why must blood be collected in sodium fluoride?",["To enhance colour","To inhibit glycolysis by red cells","To clot the blood","To lyse red cells"],1,"Fluoride inhibits enolase, so glucose is not consumed in the tube.")],
sim:{kind:"colo",dxQ:"Which classification fits this sample?",
cases:[{n:"Fasting plasma (12 h fast) from an adult.",dx:"Normal",why:"Fasting glucose of 70–99 mg/dL is normal.",k:"f",v:{glu:86}},{n:"Fasting plasma (12 h fast) from an adult.",dx:"Impaired fasting glucose",why:"A fasting value of 100–125 mg/dL is prediabetes.",k:"f",v:{glu:112}},{n:"Fasting plasma (12 h fast) from an adult.",dx:"Diabetic range",why:"Fasting glucose ≥ 126 mg/dL is in the diabetic range.",k:"f",v:{glu:168}},{n:"Plasma 2 h after a 75 g glucose load (OGTT).",dx:"Normal",why:"A 2-h value below 140 mg/dL is normal.",k:"p",v:{glu:118}},{n:"Plasma 2 h after a 75 g glucose load (OGTT).",dx:"Diabetic range",why:"A 2-h value ≥ 200 mg/dL is diagnostic of diabetes.",k:"p",v:{glu:244}},{n:"Fasting plasma from a patient with sweating and tremor.",dx:"Hypoglycaemia",why:"A glucose below 70 mg/dL, with symptoms, is hypoglycaemia.",k:"f",v:{glu:46}}],

 pip:["Add 1000 µL working reagent to tubes B, S and T.","Add 10 µL glucose standard (100 mg/dL) to tube S.","Add 10 µL sample to tube T and mix all tubes."],inc:IN(10,37),calc:"Glucose (mg/dL) = (A<sub>T</sub> / A<sub>S</sub>) × 100",
 cls:(v,c)=>c.k==="f"?{i:v<70?0:v<100?1:v<126?2:3,opts:["Hypoglycaemia","Normal","Impaired (prediabetes)","Diabetic range"],txt:"Fasting criteria: below 70 low, 70–99 normal, 100–125 impaired, 126 or more diabetic."}:{i:v<70?0:v<140?1:v<200?2:3,opts:["Hypoglycaemia","Normal","Impaired (prediabetes)","Diabetic range"],txt:"2-h post-load criteria: below 70 low, below 140 normal, 140–199 impaired, 200 or more diabetic."}})]}});

EXPS.push({id:"B5",u:2,t:"Estimation of total cholesterol and HDL cholesterol",
aim:"To estimate total cholesterol by the CHOD-PAP enzymatic method and HDL cholesterol after precipitating LDL and VLDL, and to calculate LDL cholesterol by the Friedewald equation.",
req:"Colorimeter (505 nm), CHOD-PAP reagent, cholesterol standard 200 mg/dL, HDL standard 50 mg/dL, HDL precipitating reagent (phosphotungstic acid + MgCl₂), centrifuge, fasting serum.",
th:`<h3>Principle</h3><p>Cholesterol esters are hydrolysed by cholesterol esterase to free cholesterol, which cholesterol oxidase (CHOD) oxidises to cholest-4-en-3-one and H₂O₂. Peroxidase then couples H₂O₂ with 4-aminoantipyrine and phenol to a red quinoneimine (505 nm).</p><p><b>HDL:</b> phosphotungstic acid with Mg²⁺ precipitates the apo-B-containing lipoproteins (LDL, VLDL, chylomicrons). The clear supernatant contains HDL cholesterol, which is measured as above. Serum is diluted 1:1 with the reagent, so the result is multiplied by 2.</p><h3>Calculations</h3><p>Total cholesterol (mg/dL) = (A<sub>T</sub>/A<sub>S</sub>) × 200<br>HDL-C (mg/dL) = (A<sub>T</sub>/A<sub>S</sub>) × 50 × 2<br>LDL-C = Total − HDL − TG/5 (Friedewald; valid only if TG &lt; 400 mg/dL; serum TG is supplied here because it is not part of this syllabus)</p><h3>Interpretation (NCEP ATP III)</h3><p>Total: below 200 desirable, 200–239 borderline high, 240 or more high. HDL: below 40 low (a risk factor), 60 or more protective. LDL: below 100 optimal, 130–159 borderline high.</p>`,
steps:["Total cholesterol: tubes B, S, T with 1000 µL CHOD-PAP reagent; 10 µL standard to S, 10 µL serum to T; incubate 5 min at 37 °C; read at 505 nm.","HDL: mix 200 µL serum + 200 µL precipitating reagent, stand 10 min, centrifuge 10 min at 3000 rpm.","Use 100 µL of the clear supernatant for the test tube and 100 µL HDL standard for S with 1000 µL reagent; incubate 10 min at 37 °C; read at 505 nm.","Calculate total, HDL and LDL cholesterol."],
viva:[VQ("Which lipoproteins are precipitated by phosphotungstic acid–Mg²⁺?",["HDL","LDL, VLDL and chylomicrons","Albumin","Globulins"],1,"They contain apo-B; HDL stays in the supernatant."),VQ("Why is the HDL result multiplied by 2?",["The sample was diluted 1:1 with precipitating reagent","The reagent is weak","HDL absorbs at 2×","To convert to mmol/L"],0,"200 µL serum + 200 µL reagent halves the concentration."),VQ("Which enzyme releases H₂O₂ from cholesterol?",["Cholesterol esterase","Cholesterol oxidase","Peroxidase","Lipase"],1,"CHOD oxidises cholesterol and produces H₂O₂."),VQ("The Friedewald equation is not valid when triglycerides exceed:",["100 mg/dL","200 mg/dL","400 mg/dL","50 mg/dL"],2,"VLDL-C is estimated as TG/5 only when TG is below 400 mg/dL.")],

EXPS.push({id:"B6",u:2,t:"Estimation of urea, creatinine and uric acid in serum",
aim:"To estimate serum urea (urease–Berthelot), creatinine (Jaffé alkaline picrate) and uric acid (uricase–peroxidase) and to correlate the results with renal function.",
req:"Colorimeter, water bath at 37 °C, urease reagent with phenol–nitroprusside and alkaline hypochlorite, alkaline picrate reagent, uricase–POD reagent, urea 40 mg/dL, creatinine 2 mg/dL and uric acid 6 mg/dL standards, serum.",
th:`<h3>Urea (urease–Berthelot)</h3><p>Urease splits urea into 2 NH₃ + CO₂. Ammonia reacts with phenol and hypochlorite in alkaline medium, with nitroprusside as catalyst, to give blue indophenol (580 nm). Urea (mg/dL) = (A<sub>T</sub>/A<sub>S</sub>) × 40. Blood urea nitrogen (BUN) = urea × 0.467.</p><h3>Creatinine (Jaffé)</h3><p>Creatinine reacts with picric acid in alkali to give an orange-red Janovsky complex (510 nm). Non-creatinine chromogens (glucose, ketones, proteins) interfere, so a fixed-time or kinetic reading is preferred. Creatinine = (A<sub>T</sub>/A<sub>S</sub>) × 2.</p><h3>Uric acid (uricase–POD)</h3><p>Uricase converts uric acid to allantoin and H₂O₂; peroxidase couples H₂O₂ with 4-aminoantipyrine and a phenolic dye to a red quinoneimine (520 nm). Uric acid = (A<sub>T</sub>/A<sub>S</sub>) × 6.</p><h3>Interpretation</h3><p>Urea 15–45 mg/dL (BUN 7–21); creatinine 0.7–1.3 mg/dL (men); uric acid 3.4–7.0 mg/dL (men). Both urea and creatinine rise in renal failure; a BUN:creatinine ratio above 20 suggests pre-renal azotaemia (dehydration, heart failure). Uric acid above 7 mg/dL with normal renal function suggests gout.</p>`,
steps:["Set up B, S, T for each analyte as the method describes.","Incubate (urea 10 min at 37 °C; creatinine 15 min at room temperature; uric acid 10 min at 37 °C).","Read at 580, 510 and 520 nm respectively.","Calculate each value, BUN and the BUN:creatinine ratio, then interpret."],
viva:[VQ("Which enzyme is used in the Berthelot urea method?",["Glucose oxidase","Urease","Uricase","Lipase"],1,"Urease hydrolyses urea to ammonia."),VQ("Why is the Jaffé reaction not fully specific?",["Picric acid is unstable","Other substances (glucose, acetoacetate, proteins) also give colour with alkaline picrate","It needs enzyme","It is read at 340 nm"],1,"Non-creatinine chromogens add to the colour, so the fixed-time reading is used."),VQ("Uric acid is the end product of metabolism of:",["Pyrimidines","Purines","Amino acids","Fatty acids"],1,"Xanthine oxidase converts hypoxanthine and xanthine to uric acid."),VQ("A raised urea with normal creatinine most suggests:",["Pre-renal azotaemia","Glomerular failure","Gout","Normal state"],0,"Dehydration raises urea reabsorption but creatinine stays near normal.")],
sim:{kind:"colo",dxQ:"Which condition fits these results?",
derived:(e,st,c)=>{const u=st.an[0].val,cr=st.an[1].val;if(!(u>0&&cr>0))return"";const b=u*0.467;return`<table style="max-width:480px"><tr><th>Item</th><th>Value</th></tr><tr><td>BUN = urea × 0.467</td><td><b>${fx(b,1)} mg/dL</b> (7–21)</td></tr><tr><td>BUN : creatinine</td><td><b>${fx(b/cr,1)}</b> (normal 10–20; above 20 suggests pre-renal cause)</td></tr></table>`},

an:[CA({id:"ur",name:"Urea",method:"Urease–Berthelot, 580 nm",wl:580,kA:0.40,std:40,stdU:"mg/dL",unit:"mg/dL",col:"#2563eb",refTxt:"15–45 mg/dL",dec:0,pip:["Add 1000 µL urease–phenol reagent to tubes B, S and T.","Add 10 µL urea standard (40 mg/dL) to S and 10 µL serum to T; mix.","After the first reaction add 1000 µL alkaline hypochlorite to B, S and T."],inc:IN(10,37),calc:"Urea (mg/dL) = (A<sub>T</sub> / A<sub>S</sub>) × 40",cls:RANGE(15,45)}),
 CA({id:"cr",name:"Creatinine",method:"Jaffé alkaline picrate, 510 nm",wl:510,kA:0.30,std:2,stdU:"mg/dL",unit:"mg/dL",col:"#ea580c",refTxt:"0.7–1.3 mg/dL (men)",dec:2,pip:["Add 1000 µL working picrate reagent (picric acid + NaOH) to B, S and T.","Add 100 µL creatinine standard (2 mg/dL) to S.","Add 100 µL serum to T and mix."],inc:IN(15,25),calc:"Creatinine (mg/dL) = (A<sub>T</sub> / A<sub>S</sub>) × 2",cls:RANGE(0.7,1.3)}),
 CA({id:"ua",name:"Uric acid",method:"Uricase–POD, 520 nm",wl:520,kA:0.32,std:6,stdU:"mg/dL",unit:"mg/dL",col:"#dc2626",refTxt:"3.4–7.0 mg/dL (men)",dec:1,pip:["Add 1000 µL uricase–POD reagent to B, S and T.","Add 20 µL uric acid standard (6 mg/dL) to S.","Add 20 µL serum to T and mix."],inc:IN(10,37),calc:"Uric acid (mg/dL) = (A<sub>T</sub> / A<sub>S</sub>) × 6",cls:RANGE(3.4,7.0)})]}});

EXPS.push({id:"B7",u:2,t:"Estimation of serum total protein and albumin",
aim:"To estimate serum total protein by the Biuret method and albumin by the bromocresol green (BCG) dye-binding method, and to calculate globulin and the albumin:globulin (A/G) ratio.",
req:"Colorimeter (540 and 630 nm), Biuret reagent (CuSO₄, NaOH, sodium potassium tartrate, KI), BCG reagent (pH 4.2 succinate buffer), protein standard 6 g/dL, albumin standard 4 g/dL, serum.",
th:`<h3>Total protein: Biuret</h3><p>In alkaline medium, Cu²⁺ forms a violet-blue coordination complex with the nitrogen atoms of peptide bonds (at least two). Tartrate keeps Cu²⁺ in solution; KI prevents reduction of copper. Absorbance at 540 nm is proportional to the number of peptide bonds, hence to protein. Total protein (g/dL) = (A<sub>T</sub>/A<sub>S</sub>) × 6.</p><h3>Albumin: BCG</h3><p>At pH 4.2 albumin binds bromocresol green, shifting its colour from yellow-green to blue-green (630 nm). Albumin (g/dL) = (A<sub>T</sub>/A<sub>S</sub>) × 4.</p><h3>Globulin and A/G ratio</h3><p>Globulin = total protein − albumin (normal 2.0–3.5 g/dL). A/G ratio = albumin ÷ globulin (normal about 1.2–2.2).</p><h3>Clinical correlation</h3><p>Low albumin: nephrotic syndrome (urinary loss), cirrhosis (poor synthesis), malnutrition. High globulin with low A/G: chronic liver disease, myeloma, chronic infection.</p>`,
steps:["Total protein: 1000 µL Biuret reagent in B, S, T; 20 µL standard to S and 20 µL serum to T; incubate 10 min at 37 °C; read at 540 nm.","Albumin: 1000 µL BCG reagent in B, S, T; 10 µL standard to S and 10 µL serum to T; wait 5 min; read at 630 nm.","Calculate globulin and the A/G ratio and interpret."],
viva:[VQ("What does Cu²⁺ bind to in the Biuret test?",["Side-chain –OH groups","Peptide-bond nitrogens","Sulphur atoms","Carboxyl groups only"],1,"Alkaline Cu²⁺ chelates the peptide N atoms."),VQ("At which pH does albumin bind bromocresol green?",["pH 10","pH 7.4","pH 4.2","pH 1"],2,"At pH 4.2 albumin acts as a cation and binds the anionic dye."),VQ("Low albumin with high globulin and an A/G ratio below 1 suggests:",["Normal state","Chronic liver disease or myeloma","Dehydration","Hypothyroidism only"],1,"Reduced synthesis of albumin and raised γ-globulins are typical."),VQ("Globulin is calculated as:",["Albumin − total protein","Total protein − albumin","Albumin × 2","Total protein ÷ albumin"],1,"Total protein minus albumin gives globulin.")],

EXPS.push({id:"B11",u:2,t:"Estimation of haemoglobin in blood (Sahli's method and cyanmethemoglobin method)",
aim:"To estimate haemoglobin by the visual Sahli's acid-haematin method and by the cyanmethemoglobin (Drabkin) colorimetric method, and to compare the two.",
req:"Sahli's haemoglobinometer (graduated tube, comparator, 20 µL pipette, stirrer), N/10 HCl, distilled water; colorimeter (540 nm), Drabkin's reagent, cyanmethemoglobin standard, EDTA blood.",
th:`<h3>Sahli's acid-haematin method</h3><p>Haemoglobin is converted by 0.1 N HCl into brown acid haematin (haemin) over 10 minutes. The solution is diluted until its colour matches a brown glass standard; the graduation at the meniscus gives Hb in g/dL (or %). The method is quick but approximate (error 10–20%) because the colour match is by eye, and carboxy-, met- and sulph-haemoglobin do not convert completely.</p><h3>Cyanmethemoglobin (Drabkin) method</h3><p>Ferricyanide oxidises Hb to methaemoglobin and cyanide converts it to the stable cyanmethemoglobin, absorbing at 540 nm. All haemoglobin forms except sulphaemoglobin are measured. Hb (g/dL) = (A<sub>T</sub>/A<sub>S</sub>) × concentration of standard. It is the international reference method (ICSH).</p><h3>Reference ranges</h3><p>Men 13.5–17.5 g/dL; women 12.0–15.5 g/dL. Below the range: anaemia. Above: polycythaemia or dehydration.</p><p class="small mut">Safety: Drabkin's reagent contains cyanide. Never acidify it and dispose of it as per laboratory rules.</p>`,
steps:["Sahli's: fill the graduated tube with N/10 HCl up to the 2 g/dL mark.","Draw blood to the 20 µL mark, wipe the pipette, expel into the acid and rinse three times.","Mix and wait 10 minutes for acid haematin to form.","Dilute with distilled water drop by drop, stirring, until the colour matches the standard; read the lower meniscus.","Cyanmethemoglobin: add 20 µL blood to 5 mL Drabkin's reagent, wait 5 min and read at 540 nm against the reagent blank; compare with the standard."],

an:[CA({id:"hb",name:"Haemoglobin",method:"Cyanmethemoglobin (Drabkin), 540 nm",wl:540,kA:0.30,std:15,stdU:"g/dL",unit:"g/dL",col:"#b45309",refTxt:"men 13.5–17.5 g/dL; women 12.0–15.5 g/dL",dec:1,pip:["Add 5 mL Drabkin's reagent to tubes B and T; place 5 mL cyanmethemoglobin standard (equivalent to 15 g/dL) in S.","Add 20 µL well-mixed blood to tube T.","Mix and let all three tubes stand."],inc:IN(5,25),calc:"Hb (g/dL) = (A<sub>T</sub> / A<sub>S</sub>) × 15",cls:RANGE(13.5,17.5,["Anaemic (below range)","Within reference range","Raised (above range)"])})]}},

/* Sahli engine */
function sahInit(e,n){const L=e.sim,prev=(S.st[e.id]||{}).c;let c=n?Math.floor(Math.random()*L.cases.length):Math.floor(rng(e.id)()*L.cases.length);if(n&&c===prev)c=(c+1)%L.cases.length;return{c,n:n||0,s:0,v:2,w:false,res:null,cmp:null,in:{}}}
const sahI=(st,Hb)=>Hb/st.v*(st.w?1:0.35);
function sahSVG(st,Hb){const f=i=>{const o=Math.max(0.1,Math.min(0.95,0.12+0.5*(1-Math.exp(-0.9*i))*1.5));return`rgba(120,53,15,${o})`};const hh=Math.min(150,(st.v/22)*150);

function sahHTML(e){const L=e.sim,st=ST(e,x=>sahInit(x,0)),c=L.cases[st.c],Hb=c.v.hb;
 const stp=["Fill the tube with N/10 HCl to the 2 g/dL mark","Draw 20 µL blood and expel it into the acid; rinse the pipette 3 times","Mix with the stirrer and note the time","Wait 10 minutes for acid haematin to form"];

 return h}
function sahAct(a,d){const e=EX(d.id),L=e.sim,st=ST(e,x=>sahInit(x,0)),c=L.cases[st.c];

 else if(a==="sah_new"){S.st[e.id]=Object.assign(sahInit(e,0),{c:st.c,n:st.n})}

req:"Colorimeter (546 nm), diazo reagent (sulphanilic acid + sodium nitrite), caffeine–sodium benzoate accelerator, alkaline tartrate, bilirubin calibrator 5 mg/dL, serum protected from light.",
th:`<h3>Principle</h3><p>Bilirubin couples with diazotised sulphanilic acid to form coloured azobilirubin. <b>Direct (conjugated) bilirubin</b>, bilirubin diglucuronide, is water-soluble and reacts directly. <b>Indirect (unconjugated) bilirubin</b>, bound to albumin, reacts only in the presence of an accelerator such as caffeine–benzoate. Without the accelerator the reaction measures direct bilirubin; with it, the total. In the Jendrassik–Grof method the azobilirubin is converted by alkaline tartrate to blue azobilirubin (read at 546 nm).</p><p>Indirect bilirubin = total − direct.</p><h3>Interpretation</h3><table><tr><th>Type</th><th>Direct</th><th>Indirect</th><th>Cause</th></tr><tr><td>Pre-hepatic (haemolytic)</td><td>Normal</td><td>High</td><td>Excess haemolysis</td></tr><tr><td>Hepatic (hepatocellular)</td><td>High</td><td>High</td><td>Hepatitis, cirrhosis</td></tr><tr><td>Post-hepatic (obstructive)</td><td>Very high</td><td>Normal or slightly high</td><td>Gallstone, tumour</td></tr></table><p>Reference: total 0.2–1.2 mg/dL, direct up to 0.3 mg/dL. Bilirubin is destroyed by light, so samples are kept in the dark.</p>`,

EXPS.push({id:"B13",u:2,t:"Estimation of glycogen content (anthrone method)",
aim:"To estimate glycogen in animal tissue by hydrolysing it to glucose and measuring the green colour formed with anthrone reagent.",
req:"Liver or muscle tissue (1 g), 30% KOH, 95% ethanol, centrifuge, boiling water bath, anthrone reagent (0.2% in 95% H₂SO₄), glucose standard 100 µg/mL, colorimeter (620 nm).",
th:`<h3>Principle</h3><p>Glycogen, a branched α-1,4/α-1,6 polymer of glucose, is extracted by heating tissue with hot 30% KOH, which dissolves the tissue but leaves glycogen intact. Ethanol precipitates the glycogen. In hot concentrated H₂SO₄ the polymer is hydrolysed and the glucose is dehydrated to hydroxymethylfurfural, which condenses with anthrone to give a blue-green complex (620 nm).</p><h3>Calculation</h3><p>Glucose is converted to glycogen with the factor 0.927 (162/180, loss of one water per glucose residue):</p><p>Glycogen (mg/g tissue) = (A<sub>T</sub>/A<sub>S</sub>) × 100 µg × 0.927 × (total dilution 1000) ÷ 1000 µg/mg ÷ tissue weight (1 g)</p><p>Typical values: well-fed rat liver 30–60 mg/g (3–6%); 24 h fasted liver below 15 mg/g; skeletal muscle 5–15 mg/g.</p>`,
steps:["Weigh 1 g liver and boil with 5 mL 30% KOH in a water bath for 20 min; cool.","Add 1.5 volumes of 95% ethanol, boil gently and cool on ice; centrifuge and discard the supernatant.","Dissolve the glycogen precipitate in distilled water and make up to 100 mL; dilute 1 in 10 for the test.","Blank: 1 mL water; Standard: 1 mL glucose (100 µg); Test: 1 mL diluted extract. Add 4 mL ice-cold anthrone reagent to each.","Boil for 10 minutes, cool and read at 620 nm; calculate."],

const KC=[{n:"Serum from a healthy adult.",dx:"Normal enzyme activities",why:"Both transaminases are within the reference range.",v:{ast:24,alt:22}},{n:"Serum from a patient with jaundice, nausea and dark urine.",dx:"Acute viral hepatitis",why:"ALT and AST are very high with ALT above AST: hepatocellular injury.",v:{ast:310,alt:640}},{n:"Serum from a heavy drinker with abdominal pain.",dx:"Alcoholic hepatitis",why:"AST is raised more than ALT (AST:ALT above 2).",v:{ast:180,alt:70}},{n:"Serum from a patient with chest pain.",dx:"Myocardial infarction",why:"AST rises (also found in heart muscle) while ALT stays normal.",v:{ast:220,alt:38}}];
EXPS.push({id:"B14",u:2,t:"Estimation of SGOT (AST) and SGPT (ALT)",
aim:"To measure the activity of aspartate aminotransferase (SGOT) and alanine aminotransferase (SGPT) in serum by the UV kinetic (IFCC) method and to interpret the pattern.",
req:"UV spectrophotometer (340 nm, 37 °C), AST and ALT kinetic reagents (L-aspartate or L-alanine, 2-oxoglutarate, NADH, MDH or LDH), serum.",
th:`<h3>Principle</h3><p><b>AST:</b> L-aspartate + 2-oxoglutarate ⇌ oxaloacetate + L-glutamate. Oxaloacetate + NADH + H⁺ → malate + NAD⁺ (malate dehydrogenase, MDH).</p><p><b>ALT:</b> L-alanine + 2-oxoglutarate ⇌ pyruvate + L-glutamate. Pyruvate + NADH + H⁺ → lactate + NAD⁺ (lactate dehydrogenase, LDH).</p><p>NADH absorbs at 340 nm and NAD⁺ does not, so the rate of fall in absorbance (ΔA/min) is proportional to enzyme activity. Pyridoxal-5-phosphate is the coenzyme.</p><h3>Calculation</h3><p>Activity (U/L) = ΔA/min × (V<sub>total</sub> × 1000) / (ε × V<sub>sample</sub> × light path) = ΔA/min × (1.1 × 1000)/(6.22 × 0.1 × 1) = <b>ΔA/min × 1768</b>, using ε(NADH, 340 nm) = 6.22 L mmol⁻¹ cm⁻¹. If ΔA/min exceeds about 0.08 the NADH is being used up and the rate is no longer linear; dilute the serum 1 + 9 with saline, repeat and multiply by 10.</p><h3>Interpretation</h3><p>AST and ALT up to about 40 U/L. ALT is mainly in liver, so it is the more specific marker of hepatocellular damage. AST is also in heart, skeletal muscle and kidney. Viral hepatitis: ALT &gt; AST, both very high. Alcoholic liver disease: AST:ALT above 2. Myocardial infarction: AST rises, ALT remains normal.</p>`,
steps:["Pre-warm 1000 µL reagent to 37 °C.","Add 100 µL serum, mix, wait 60 s (lag phase).","Read A at 340 nm and then every minute for 3 minutes.","Calculate mean ΔA/min and multiply by 1768; if the fall is not linear, dilute and repeat."],
viva:[VQ("Why is absorbance measured at 340 nm?",["NAD⁺ absorbs there","NADH absorbs there and is consumed","The product is blue","Protein absorbs there"],1,"Fall in NADH is followed at 340 nm."),VQ("Which enzyme is more specific to the liver?",["AST","ALT","Both equally","Neither"],1,"AST is also found in heart, muscle and kidney."),VQ("What is the purpose of the lag period?",["To heat the reagent","To use up endogenous pyruvate/α-keto acids before the linear phase","To stop the reaction","To precipitate protein"],1,"Side reactions consume endogenous substrates before the measured linear rate."),VQ("An AST:ALT ratio above 2 suggests:",["Viral hepatitis","Alcoholic liver disease","Normal state","Obstruction only"],1,"Alcohol depletes pyridoxal phosphate more for ALT and damages mitochondria, so AST dominates.")],
sim:{kind:"kin",cases:KC,dxQ:"What do the enzyme results suggest?",
an:[{id:"ast",name:"SGOT (AST)",ref:[8,40],sub:"Oxaloacetate + NADH → malate + NAD⁺ (MDH)"},{id:"alt",name:"SGPT (ALT)",ref:[7,40],sub:"Pyruvate + NADH → lactate + NAD⁺ (LDH)"}]}});
function kinInit(e,n){const L=e.sim,prev=(S.st[e.id]||{}).c;let c=n?Math.floor(Math.random()*L.cases.length):Math.floor(rng(e.id)()*L.cases.length);if(n&&c===prev)c=(c+1)%L.cases.length;return{c,n:n||0,a:0,an:L.an.map(()=>({p:0,rd:[],dil:false,calcOK:null,val:null,cls:null,msg:null})),dx:null,in:{}}}
function kinA(e,st,an,as,k){const c=e.sim.cases[st.c],U=c.v[an.id]/(as.dil?10:1),rate=U/KF,A0=1.08+0.04*rng(e.id+an.id+st.n)(),fl=0.2,span=A0-fl;return +(A0-span*(1-Math.exp(-rate*k/span))+(rng(e.id+an.id+st.n+k)()-0.5)*0.0015).toFixed(3)}
function kinHTML(e){const L=e.sim,st=ST(e,x=>kinInit(x,0)),c=L.cases[st.c],an=L.an[st.a],as=st.an[st.a];
 let h=`<div class="note"><b>Sample ${st.n+1}:</b> ${c.n}</div><div class="tabs">${L.an.map((a,i)=>`<button class="${i===st.a?"on":""}" data-a="kin_an" data-id="${e.id}" data-v="${i}">${a.name}${st.an[i].calcOK?" ✔":""}</button>`).join("")}</div><p class="small"><b>Reaction:</b> ${an.sub}; NADH falls at 340 nm. <b>Reference:</b> ${an.ref[0]}–${an.ref[1]} U/L.</p>`;
 const pip=["Pre-warm 1000 µL kinetic reagent in the cuvette at 37 °C.",as.dil?"Add 100 µL of the 1 + 9 diluted serum and mix.":"Add 100 µL serum and mix.","Wait 60 s (lag phase)."];
 h+=`<ol class="steps">${pip.map((p,i)=>`<li class="${i<as.p?"done":""}">${p}${i===as.p?" "+btn("kin_pip",e.id,"Do this","b"):""}</li>`).join("")}</ol>`;
 if(as.p>=3){h+=`<h3>Absorbance at 340 nm</h3><div class="row">${btn("kin_rd",e.id,"Read now (time "+as.rd.length+" min)","b",null,as.rd.length>=4)}${btn("kin_dil",e.id,as.dil?"Diluted 1 + 9 ✔":"Dilute serum 1 + 9 and repeat","g",null,as.dil)}</div><table style="max-width:420px"><tr><th>Time (min)</th><th>A<sub>340</sub></th><th>ΔA</th></tr>${[0,1,2,3].map(i=>`<tr><td>${i}</td><td>${as.rd[i]!=null?as.rd[i].toFixed(3):"–"}</td><td>${i>0&&as.rd[i]!=null?(as.rd[i-1]-as.rd[i]).toFixed(3):""}</td></tr>`).join("")}</table>`;
  if(as.rd.length===4){const d=[0,1,2].map(i=>as.rd[i]-as.rd[i+1]),mean=(as.rd[0]-as.rd[3])/3;if(mean>0.08&&!as.dil)h+=`<div class="warn">ΔA/min is above the linear range of the method (about 0.08 at 340 nm): the fall per minute shrinks as NADH is used up. Dilute the serum 1 + 9 and repeat.</div>`;
   h+=`<h3>Calculate</h3><p class="small">Activity (U/L) = mean ΔA/min × 1768${as.dil?" × 10 (dilution)":""}. Mean ΔA/min from your readings = ${mean.toFixed(4)}.</p><div class="row">${inp(e.id,st,"val"+an.id,"U/L",130)}<span>U/L</span>${btn("kin_calc",e.id,"Check","b")}</div>${msgH(as.msg)}`;
   if(as.calcOK){const r=RANGE(an.ref[0],an.ref[1])(as.val,c,{id:an.id,unit:"U/L"});h+=`<h3>Interpret</h3><div class="row">${r.opts.map((o,i)=>btn("kin_cls",e.id,o,as.cls===i?(i===r.i?"b":"g"):"g",i,as.cls!=null)).join("")}</div>`;if(as.cls!=null)h+=`<div class="${as.cls===r.i?"okb":"badb"}">${as.cls===r.i?"Correct.":"Not correct: "+r.opts[r.i]+"."} Laboratory value: <b>${c.v[an.id]} U/L</b> (your result ${fx(as.val,0)}).</div>`}}}
 if(st.an.every(a=>a.calcOK)){const r=c.v.ast/c.v.alt;h+=`<h3>Pattern</h3><p>AST:ALT = <b>${fx(st.an[0].val/st.an[1].val,2)}</b>.</p><h3>${L.dxQ}</h3><div class="row">${[...new Set(L.cases.map(x=>x.dx))].map((d,i)=>btn("kin_dx",e.id,d,st.dx===d?(d===c.dx?"b":"g"):"g",i,st.dx!=null)).join("")}</div>`;if(st.dx!=null)h+=`<div class="${st.dx===c.dx?"okb":"badb"}"><b>${st.dx===c.dx?"Correct.":"Not correct."}</b> ${c.why}</div>`;h+=btn("kin_new",e.id,"New sample","g")}
 return h}
function kinAct(a,d){const e=EX(d.id),L=e.sim,st=ST(e,x=>kinInit(x,0)),an=L.an[st.a],as=st.an[st.a],c=L.cases[st.c];
 if(a==="kin_an")st.a=+d.v;else if(a==="kin_pip")as.p++;
 else if(a==="kin_rd")as.rd.push(kinA(e,st,an,as,as.rd.length));
 else if(a==="kin_dil"){as.dil=true;as.rd=[];as.p=1;as.msg=null}
 else if(a==="kin_calc"){const v=num(st,"val"+an.id),m=(as.rd[0]-as.rd[3])/3*KF*(as.dil?10:1);if(!(v>0))as.msg={c:"warn",t:"Enter your calculated activity."};else if(Math.abs(v-m)/m>0.04)as.msg={c:"badb",t:"Check the calculation: mean ΔA/min × 1768"+(as.dil?" × 10":"")+"."};
  else{as.val=v;as.calcOK=true;as.msg={c:"okb",t:"Calculation correct."};const tr=c.v[an.id];addRec(e.id,{k:an.id+st.n,sample:an.name+" – sample "+(st.n+1),res:fx(v,0)+" U/L (lab value "+tr+")",ok:Math.abs(v-tr)/tr<=0.1})}}
 else if(a==="kin_cls")as.cls=+d.v;
 else if(a==="kin_dx"){st.dx=[...new Set(L.cases.map(x=>x.dx))][+d.v];addRec(e.id,{k:"dx"+st.n,sample:"Sample "+(st.n+1),res:"Interpretation: "+st.dx,ok:st.dx===c.dx})}
 else if(a==="kin_new")S.st[e.id]=kinInit(e,st.n+1)}
/* ===== PLOT HELPER ===== */
function plotSVG(o){const W=o.w||300,H=o.h||210,l=44,b=34,t=12,r=12,xm=o.xmax,ym=o.ymax,x0=o.xmin||0,y0=o.ymin||0;const X=x=>l+(x-x0)/(xm-x0)*(W-l-r),Y=y=>H-b-(y-y0)/(ym-y0)*(H-b-t);
 let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W+60}px"><rect x="${l}" y="${t}" width="${W-l-r}" height="${H-b-t}" fill="none" stroke="#8a97a0"/>`;

 <div class="card"><h2>Syllabus and your progress</h2><div class="pb" style="margin:6px 0 12px"><i style="width:${Math.min(100,d/NEED*100)}%"></i></div><p class="small mut">${d} of 14 experiments completed. The syllabus requires a minimum of ${NEED}.</p>`+UNITS.map(u=>`<h3>${u.t}</h3><ul>${EXPS.filter(e=>e.u===u.n).map(e=>`<li>${e.id.slice(1)}. <a href="#" data-a="ui_go" data-v="${e.id}" style="color:var(--ac)">${e.t}</a>${S.done[e.id]?" ✅":""}</li>`).join("")}</ul>`).join("")+`<h3>Recommended references</h3><ul class="small">${REFS.map(r=>`<li>${r}</li>`).join("")}</ul>
 <div class="note small">Kit-based methods (GOD-POD, CHOD-PAP, urease–Berthelot, Jaffé, uricase, Biuret, BCG, Jendrassik–Grof, IFCC transaminase) differ slightly between manufacturers in volumes, standards and incubation. Here the volumes, wavelengths and factors are typical values, and absorbances are generated from Beer–Lambert behaviour with realistic noise. Reference ranges are the commonly quoted adult ranges and vary with the laboratory and kit. Check your institute's manual and the kit insert before using a value in an examination. This lab prepares you for the bench; it does not replace hands-on work.</div></div>`}
function tabsH(){const T=[["aim","Aim"],["theory","Theory"],["proc","Procedure"],["sim","Simulation"],["viva","Viva"]];return`<div class="tabs">${T.map(t=>`<button class="${S.tab===t[0]?"on":""}" data-a="ui_tab" data-v="${t[0]}">${t[1]}</button>`).join("")}</div>`}
function vivaH(e){const a=S.vv[e.id]||(S.vv[e.id]=[]);let sc=0;const h=e.viva.map((q,i)=>{const p=a[i],ans=p!=null;if(ans&&p===q.a)sc++;return`<div class="note"><b>${i+1}. ${q.q}</b>${q.o.map((o,j)=>`<button class="${ans&&j===q.a?"b":"g"} opt" data-a="ui_viva" data-v="${i}:${j}" ${ans?"disabled":""}>${o}${ans&&p===j?(j===q.a?" ✓":" ✗"):""}</button>`).join("")}${ans?`<div class="${p===q.a?"okb":"badb"}">${p===q.a?"Correct. ":"Not quite. "}${q.e}</div>`:""}</div>`}).join("");return h+`<p class="mut">Score: ${sc} / ${e.viva.length}</p>`}
const KINDS={tests:tstHTML,colo:colHTML,sahli:sahHTML,kin:kinHTML,am1:am1HTML,am2:am2HTML,am3:am3HTML};
function subExp(e,k){const id=e.id+"_"+k;return PSEUDO[id]||(PSEUDO[id]=Object.assign({},e,{id,sim:e.sims[k].sim}))}
function simH(e){if(!e.sims)return`<div class="sim">${KINDS[e.sim.kind](e)}</div>`;const k=S.sub[e.id]||0,p=subExp(e,k);return`<div class="tabs">${e.sims.map((s,i)=>`<button class="${i===k?"on":""}" data-a="ui_sub" data-v="${i}">${s.label}</button>`).join("")}</div><div class="sim">${KINDS[p.sim.kind](p)}</div>`}
function expH(e){let h=`<div class="card"><h2>${e.id.slice(1)}. ${e.t}</h2><div><span class="chip">${UNITS.find(u=>u.n===e.u).t}</span></div>${tabsH()}`;
 if(S.tab==="aim")h+=`<h3>Aim</h3><p>${e.aim}</p><h3>Requirements</h3><p>${e.req}</p>`;
 else if(S.tab==="theory")h+=e.th;
 else if(S.tab==="proc")h+=`<h3>Procedure</h3><ol class="steps">${e.steps.map(s=>`<li>${s}</li>`).join("")}</ol><div class="note">Go to the <b>Simulation</b> tab to perform it.</div>`;
 else if(S.tab==="viva")h+=vivaH(e);
 else h+=simH(e);
 return h+`</div>`}
const rid=i=>i.replace(/_\d+$/,"");
function recH(){const nm=S.name||"(enter your name above)",rl=S.roll||"";let h=`<div class="card"><h2>Practical record</h2><p>Student: <b>${nm}</b> ${rl?"· Roll no. <b>"+rl+"</b>":""}</p>`;
 if(!S.rec.length)h+=`<p class="mut">Nothing recorded yet. Complete an experiment's simulation and it is entered here automatically.</p>`;
 else h+=`<div style="overflow-x:auto"><table><tr><th>Experiment</th><th>Item</th><th>Result</th><th></th></tr>${S.rec.slice().sort((a,b)=>+rid(a.id).slice(1)-+rid(b.id).slice(1)||(a.k<b.k?-1:1)).map(r=>`<tr><td>${rid(r.id).slice(1)}. ${short(r.title)}</td><td>${r.sample}</td><td>${r.res}</td><td>${r.ok?"✓":"✗"}</td></tr>`).join("")}</table></div>`;
 h+=`<p>Experiments completed: <b>${nDone()}</b> of 14 (minimum required: ${NEED}) ${nDone()>=NEED?"✅":""}</p>`;
 if(S.dl)h+=`<div class="row" style="margin-top:12px"><button class="b" data-a="ui_dl" data-v="html">⬇ Download record (HTML)</button><button class="g" data-a="ui_dl" data-v="csv">⬇ Download (CSV)</button></div>`;
 else h+=`<p class="small mut">Downloads are available when this page is opened inside claude.ai.</p>`;return h+`</div>`}
function render(){$("#nav").innerHTML=navH();const m=$("#main");m.innerHTML=S.sel?expH(EX(S.sel)):(S.tab==="rec"?recH():homeH())}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const plain=s=>String(s).replace(/<[^>]+>/g,"");
async function dl(kind){if(!S.dl)return;const d=new Date().toLocaleDateString("en-IN"),rows=S.rec.slice().sort((a,b)=>+rid(a.id).slice(1)-+rid(b.id).slice(1)||(a.k<b.k?-1:1));
 try{if(kind==="csv"){const q=s=>'"'+plain(s).replace(/"/g,'""')+'"';await S.dl.save({filename:"bp207p-record.csv",data:["Experiment,Item,Result,Correct"].concat(rows.map(r=>[q(rid(r.id).slice(1)+" "+short(r.title)),q(r.sample),q(r.res),r.ok?"yes":"no"].join(","))).join("\n")})}
 else await S.dl.save({filename:"bp207p-record.html",data:`<!doctype html><meta charset="utf-8"><title>BP207P practical record</title><style>body{font:14px system-ui;margin:30px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #bbb;padding:6px 8px;text-align:left}th{background:#fbe7ec}</style><h2>BP207P Biochemistry (Practical): record</h2><p>Student: ${esc(S.name||"")} &nbsp; Roll no.: ${esc(S.roll||"")} &nbsp; Date: ${d}</p><table><tr><th>Experiment</th><th>Item</th><th>Result</th><th>OK</th></tr>${rows.map(r=>`<tr><td>${esc(rid(r.id).slice(1)+". "+short(r.title))}</td><td>${esc(plain(r.sample))}</td><td>${esc(plain(r.res))}</td><td>${r.ok?"✓":"✗"}</td></tr>`).join("")}</table><p style="margin-top:30px">Signature of teacher: ____________________</p><p style="font-size:12px;color:#555">Designed and Created by Dr. Babaraj Udugade and Mrs. Swati Udugade · Copyright © Maharashtra Academy of Skills and Knowledge · Registered under MSME</p>`})}catch(x){}}
/* ===== EVENTS ===== */
const ROUTES=[[/^tst_/,tstAct],[/^col_/,colAct],[/^sah_/,sahAct],[/^kin_/,kinAct],[/^am1_/,am1Act],[/^am2_/,am2Act],[/^am3_/,am3Act]];
document.addEventListener("click",ev=>{const b=ev.target.closest("[data-a]");if(!b||b.disabled)return;ev.preventDefault();const a=b.dataset.a,d=b.dataset;
 if(a==="ui_home"){S.sel=null;S.tab="home"}else if(a==="ui_rec"){S.sel=null;S.tab="rec"}else if(a==="ui_go"){S.sel=d.v;S.tab="aim";window.scrollTo(0,0)}else if(a==="ui_tab")S.tab=d.v;
 else if(a==="ui_sub")S.sub[S.sel]=+d.v;
 else if(a==="ui_viva"){const[i,j]=d.v.split(":").map(Number),x=S.vv[S.sel]||(S.vv[S.sel]=[]);x[i]=j}else if(a==="ui_dl"){dl(d.v);return}
 else{const r=ROUTES.find(x=>x[0].test(a));if(r)r[1](a,d)}
 render()});
function setIn(el){const k=el.dataset.k,id=el.dataset.id;if(!k||!id)return;const st=S.st[id];if(st){(st.in||(st.in={}))[k]=el.value}}
document.addEventListener("input",ev=>setIn(ev.target));document.addEventListener("change",ev=>setIn(ev.target));
$("#nm").addEventListener("input",e=>{S.name=e.target.value});$("#rl").addEventListener("input",e=>{S.roll=e.target.value});
try{window.claude&&Promise.resolve(claude.use("downloads")).then(d=>{S.dl=d;if(S.tab==="rec"&&!S.sel)render()}).catch(()=>{})}catch(x){}
render();

</script>
